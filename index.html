<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SENSINT</title>
  <script>
    // Right after a deploy, a cached copy of this page can ask for script/style files the deploy
    // just replaced. If one fails to load, reload once from a fresh URL that skips the cache.
    addEventListener('error', function (e) {
      var t = e.target;
      if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
      try {
        if (sessionStorage.getItem('sensint.reloaded')) return; // already tried once: don't loop
        sessionStorage.setItem('sensint.reloaded', '1');
      } catch (_) { return; }
      location.replace(location.pathname + '?v=' + Date.now() + location.hash);
    }, true);
  </script>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main id="file" class="file">
    <header>
      <span class="stamp">Classified</span>
      <h1>SENSINT</h1>
      <p class="sub">Sensitivity Intelligence · <span id="stage-name">Intake form</span></p>
    </header>

    <form id="form">
      <p id="mine" class="mine" hidden><span id="mine-text"></span> <button id="mine-open" type="button" class="link">My file</button></p>
      <label>Mouse DPI <input name="dpi" type="number" min="100" max="32000" value="600" required /></label>
      <label>Game <select name="game"></select></label>
      <label>Current in-game sensitivity <input name="sens" type="number" step="any" min="0.001" required /></label>
      <label id="aiming-row">Aiming sensitivity (recorded; used in Phase 2) <input name="aiming" type="number" step="any" min="0" /></label>
      <label>Mousepad width, cm (optional) <input name="pad" type="number" step="any" min="0" /></label>
      <p class="field">Baseline <output name="cm360">—</output> cm/360</p>
      <p id="warn" class="warn" hidden></p>
      <label>Code name (optional) <input name="codename" maxlength="24" placeholder="SUBJECT" autocomplete="off" /></label>
      <label>Session type
        <select name="kind">
          <option value="hip" selected>Hip sensitivity</option>
          <option value="ads">Red-dot aiming (Tarkov)</option>
          <option value="warmup">Warm-up at my settings</option>
        </select>
      </label>
      <button id="latest" type="button" class="secondary" hidden>Use my latest verdicts</button>
      <p id="reddot-row" class="field" hidden>Red-dot baseline <output name="reddot">—</output> cm/360</p>
      <p class="hint">Drills: <span id="preset"></span></p>
      <label id="length-row" hidden>Warm-up length
        <select name="minutes">
          <option value="3">3 minutes</option>
          <option value="5" selected>5 minutes</option>
          <option value="10">10 minutes</option>
        </select>
      </label>
      <label id="rounds-row">Rounds per candidate
        <select name="rounds">
          <option value="2" selected>2 (recommended)</option>
          <option value="3">3 (longer, narrower range)</option>
        </select>
      </label>
      <label>Seed <input name="seed" type="number" /></label>
      <button id="begin" type="submit">Begin session</button>
      <button id="quick" type="button" class="secondary">Quick Flick test (12 s)</button>
      <label class="file-btn secondary">Open saved session or backup <input id="open" type="file" multiple accept=".json,.gz,application/json,application/gzip" /></label>
      <button id="history" type="button" class="secondary">My file (settings, warm-ups, sessions)</button>
      <p class="hint">Chrome or Edge recommended for raw input. Esc aborts a trial; it restarts from the beginning.</p>
    </form>

    <section id="brief" hidden>
      <p class="kicker" id="brief-kicker"></p>
      <h2 id="brief-title"></h2>
      <p id="brief-text"></p>
      <button id="go" type="button">Start</button>
    </section>

    <section id="result" hidden>
      <div id="debrief"></div>
      <button id="share" type="button">Copy share link</button>
      <button id="export" type="button" class="secondary">Export session JSON</button>
      <button id="follow" type="button" class="secondary">Follow-up session centred here</button>
      <button id="again" type="button" class="secondary">New session</button>
      <input id="share-out" readonly hidden aria-label="Share link" />
    </section>
  </main>
  <canvas id="stage" hidden></canvas>
  <div id="crosshair" hidden></div>
  <div id="mask" aria-hidden="true"></div>
  <div id="next" hidden></div>
  <div id="cue" aria-hidden="true"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
