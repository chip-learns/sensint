<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SENSINT</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main id="intake" class="file">
    <header>
      <span class="stamp">Classified</span>
      <h1>SENSINT</h1>
      <p class="sub">Sensitivity Intelligence · Intake form</p>
    </header>
    <form id="form">
      <label>Mouse DPI <input name="dpi" type="number" min="100" max="32000" value="600" required /></label>
      <label>Game
        <select name="game"></select>
      </label>
      <label>Current in-game sensitivity <input name="sens" type="number" step="any" min="0.001" required /></label>
      <p class="field">Baseline <output name="cm360">—</output> cm/360</p>
      <p id="warn" class="warn" hidden></p>
      <label>Seed <input name="seed" type="number" /></label>
      <button type="submit">Begin Flick trial (30 s)</button>
      <p class="hint">Click to fire. Esc aborts. Chrome or Edge recommended for raw input.</p>
    </form>
    <section id="result" hidden>
      <h2>Field report</h2>
      <pre id="summary"></pre>
      <button id="export" type="button">Export session JSON</button>
    </section>
  </main>
  <canvas id="stage" hidden></canvas>
  <div id="crosshair" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
